# extreme3dpro_driver parameters (ROS 1 and ROS 2)

device: /dev/input/js0      # joystick device (ls /dev/input/js*)
frame_id: extreme3dpro      # Joy header
publish_rate: 50.0          # Hz
reconnect_sec: 1.0          # retry period while the joystick is unplugged
autorepeat: true            # publish every period, also without new events
deadzone: 0.05              # 0..1, applied to Joy axes and cmd_vel

# cmd_vel
publish_twist: true
linear_scale: 1.0           # m/s at full deflection
angular_scale: 1.0          # rad/s at full twist
throttle_mode: scale        # scale: slider scales cmd_vel (back 0, forward 1)
                            # linear_z: slider is linear.z · none: ignored

# Axes (Linux joystick indices): 0 stick X, 1 stick Y, 2 twist, 3 slider, 4/5 hat
axis_x: 0                   # -> linear.y
axis_y: 1                   # -> linear.x
axis_yaw: 2                 # -> angular.z
axis_throttle: 3

# cmd_vel is zero unless this button is held: 0 trigger, -1 disables the deadman
deadman_btn: 0
